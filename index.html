<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Taper">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)">
<title>Taper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  /* A ration ledger. Parchment and ink by day, graphite and vapor by night.
     Honey is the ration you have spent; ember is the line you crossed. */
  :root {
    color-scheme: light dark;
    --page: #f4f1ea;
    --slab: #fbf9f4;
    --ink: #1b1a17;
    --ink-2: rgba(27, 26, 23, 0.64);
    --ink-3: rgba(27, 26, 23, 0.42);
    --ink-4: rgba(27, 26, 23, 0.22);
    --rule: rgba(27, 26, 23, 0.10);
    --track: rgba(27, 26, 23, 0.08);
    --honey: #c68a17;
    --honey-ink: #1b1a17;
    --ember: #cc3c29;
    --ember-ink: #fff6f2;
    --face-display: ui-serif, "New York", "Iowan Old Style", Palatino, Georgia, serif;
    --face-ui: -apple-system, BlinkMacSystemFont, system-ui, "SF Pro Text", "Helvetica Neue", sans-serif;
    --face-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #131315;
      --slab: #1c1c1f;
      --ink: #f2efe8;
      --ink-2: rgba(242, 239, 232, 0.66);
      --ink-3: rgba(242, 239, 232, 0.42);
      --ink-4: rgba(242, 239, 232, 0.22);
      --rule: rgba(242, 239, 232, 0.09);
      --track: rgba(242, 239, 232, 0.10);
      --honey: #e3aa3d;
      --honey-ink: #17130a;
      --ember: #ee5b46;
      --ember-ink: #fff5f2;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.4 var(--face-ui);
    min-height: 100vh;
    min-height: 100dvh;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 16px)
             calc(env(safe-area-inset-right, 0px) + 20px)
             calc(env(safe-area-inset-bottom, 0px) + 136px)
             calc(env(safe-area-inset-left, 0px) + 20px);
  }

  /* ---- Top line: the date as a ledger heading, the strength as a stamp ---- */
  .top { display: flex; align-items: center; justify-content: space-between; }
  .date { font: 500 24px/1.1 var(--face-display); letter-spacing: -0.01em; }
  .stamp {
    font: 500 12px/1 var(--face-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-2);
    padding: 7px 9px 6px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }

  /* ---- The staircase: fifteen weeks stepping down to zero ---- */
  .stairs { margin-top: 16px; }
  .stairs svg { display: block; width: 100%; height: 28px; }
  .step { fill: var(--track); transition: fill 0.2s; }
  .step.past { fill: var(--ink-4); }
  .step.now { fill: var(--honey); }
  .caption {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    font-size: 12px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  /* ---- The ration ring: one segment per allowed hit, a hand sweeping to the reset ---- */
  .hour {
    position: relative;
    width: min(72vw, 268px);
    aspect-ratio: 1;
    margin: 26px auto 0;
  }
  .ring { display: block; width: 100%; height: 100%; overflow: visible; }
  .seg { fill: none; stroke: var(--track); stroke-width: 16; transition: stroke 0.2s; }
  .seg.used { stroke: var(--honey); }
  .capped .seg.used { stroke: var(--ember); }
  .seg.pop { animation: pop 0.24s var(--ease-out); }
  @keyframes pop { from { stroke-width: 5; opacity: 0.3; } }
  .seg.track-only { stroke-width: 2; stroke: var(--rule); }
  .time-track { fill: none; stroke: var(--rule); stroke-width: 2; }
  .time-arc { fill: none; stroke: var(--ink-3); stroke-width: 2; stroke-linecap: round; }
  .time-dot { fill: var(--ink); }
  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
  }
  .count {
    font: 500 78px/1 var(--face-display);
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    transition: color 0.2s;
  }
  .capped .count { color: var(--ember); }
  .sub { margin-top: 5px; font-size: 15px; font-weight: 500; color: var(--ink-2); transition: color 0.2s; }
  .capped .sub { color: var(--ember); }
  .reset { margin-top: 7px; font: 12px/1 var(--face-mono); letter-spacing: 0.02em; color: var(--ink-3); }

  /* ---- Ledger rows ---- */
  .section { margin-top: 32px; }
  .row-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .figures {
    font: 500 13px/1 var(--face-ui);
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .figures b { font-weight: 600; color: var(--ink); }
  .figures .bad { font-weight: 600; color: var(--ember); }

  /* 24 cells, one per clock hour */
  .strip { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; height: 10px; }
  .strip.big { height: 16px; margin-top: 12px; }
  .strip i { display: block; border-radius: 2px; background: var(--track); }
  .strip i.under { background: var(--honey); opacity: var(--f); }
  .strip i.cap { background: var(--honey); }
  .strip i.over { background: var(--ember); }
  .strip i.plain { background: var(--ink-3); opacity: var(--f); }
  .strip i.future { opacity: 0.35; }
  .strip i.now { box-shadow: inset 0 0 0 1.5px var(--ink); }

  .days { list-style: none; margin: 8px 0 0; padding: 0; }
  .days li {
    display: grid;
    grid-template-columns: 50px 1fr 40px 36px;
    align-items: center;
    gap: 12px;
    height: 36px;
    border-top: 1px solid var(--rule);
  }
  .days li:first-child { border-top: 0; }
  .dow { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .n { text-align: right; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .over { text-align: right; font-size: 12px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
  .over.bad { color: var(--ember); font-weight: 600; }

  .tools { display: flex; justify-content: center; gap: 4px; margin-top: 28px; }
  .btn {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    margin: 0;
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .ghost {
    min-height: 44px;
    padding: 0 16px;
    background: none;
    border-radius: 8px;
    font: 500 13px/1 var(--face-ui);
    color: var(--ink-3);
    transition: color 0.12s;
  }
  .ghost:active { color: var(--ink); }
  .ghost.danger:active { color: var(--ember); }

  /* ---- The thumb bar: always under the thumb, never behind the scroll ---- */
  .thumb {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    padding: 18px calc(env(safe-area-inset-right, 0px) + 16px)
             calc(env(safe-area-inset-bottom, 0px) + 12px)
             calc(env(safe-area-inset-left, 0px) + 16px);
    background: linear-gradient(to top, var(--page) 72%, transparent);
  }
  .thumb-inner { display: flex; gap: 10px; max-width: 448px; margin: 0 auto; }
  .plus {
    flex: 3;
    min-height: 88px;
    border-radius: 18px;
    background: var(--honey);
    color: var(--honey-ink);
    font: 500 44px/1 var(--face-display);
    letter-spacing: -0.02em;
    transition: transform 0.12s var(--ease-out), background-color 0.2s, color 0.2s;
  }
  .plus:active { transform: scale(0.97); }
  .capped .plus { background: var(--ember); color: var(--ember-ink); }
  .undo {
    flex: 1;
    min-height: 88px;
    border-radius: 18px;
    background: var(--slab);
    box-shadow: inset 0 0 0 1px var(--rule);
    color: var(--ink-2);
    font: 600 15px/1 var(--face-ui);
    transition: transform 0.12s var(--ease-out), opacity 0.2s;
  }
  .undo:active { transform: scale(0.97); }
  .undo:disabled { opacity: 0.35; transform: none; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    .seg.pop { animation: none; }
    .plus, .undo, .seg, .count, .sub, .step { transition: none; }
  }
</style>
</head>
<body>

<main>
  <header class="top">
    <div class="date" id="date">—</div>
    <div class="stamp" id="stamp">—</div>
  </header>

  <section class="stairs" aria-label="Taper schedule">
    <svg id="stairs" viewBox="0 0 300 28" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="caption"><span id="week">—</span><span id="daysLeft">—</span></div>
  </section>

  <section class="hour" id="hour" aria-live="polite">
    <svg class="ring" id="ring" viewBox="0 0 240 240" aria-hidden="true"></svg>
    <div class="center">
      <div class="count" id="count">0</div>
      <div class="sub" id="sub">this hour</div>
      <div class="reset" id="reset"></div>
    </div>
  </section>

  <section class="section">
    <div class="row-head"><span>Today</span><span class="figures" id="figures"></span></div>
    <div class="strip big" id="todayStrip" aria-label="Hits by hour today"></div>
  </section>

  <section class="section">
    <div class="row-head"><span>Last 7 days</span><span class="figures">hits · hours over</span></div>
    <ol class="days" id="history"></ol>
  </section>

  <section class="tools">
    <button class="btn ghost" id="btnExport" type="button">Export</button>
    <button class="btn ghost danger" id="btnReset" type="button">Reset</button>
  </section>
</main>

<div class="thumb">
  <div class="thumb-inner">
    <button class="btn plus" id="btnPlus" type="button" aria-label="Log one hit">+1</button>
    <button class="btn undo" id="btnUndo" type="button">Undo</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Each entry applies from its start date (local time) until the next entry's start.
  var SCHEDULE = [
    { start: '2026-09-15', strength: '5%',   hourlyCap: 12 },
    { start: '2026-09-22', strength: '5%',   hourlyCap: 10 },
    { start: '2026-09-29', strength: '5%',   hourlyCap: 8 },
    { start: '2026-10-06', strength: '3%',   hourlyCap: 8 },
    { start: '2026-10-13', strength: '3%',   hourlyCap: 7 },
    { start: '2026-10-20', strength: '3%',   hourlyCap: 6 },
    { start: '2026-10-27', strength: '3%',   hourlyCap: 5 },
    { start: '2026-11-03', strength: '3%',   hourlyCap: 4 },
    { start: '2026-11-10', strength: '3%',   hourlyCap: 3 },
    { start: '2026-11-17', strength: '3%',   hourlyCap: 3 },
    { start: '2026-11-24', strength: '3%',   hourlyCap: 2 },
    { start: '2026-12-01', strength: '3%',   hourlyCap: 2 },
    { start: '2026-12-08', strength: '3%',   hourlyCap: 1 },
    { start: '2026-12-15', strength: '3%',   hourlyCap: 1 },
    { start: '2026-12-22', strength: '3%',   hourlyCap: 1 },
    { start: '2026-12-26', strength: 'quit', hourlyCap: 0 }
  ];
  var QUIT_DATE = '2026-12-26';
  var TOTAL_WEEKS = 15;
  var STORAGE_KEY = 'taper.hits';
  var HITS_PER_POD = 200;
  var MS_PER_DAY = 86400000;
  var SVG_NS = 'http://www.w3.org/2000/svg';

  // ---- Date helpers (all in the device's local time) ----
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function parseLocalDate(ymd) {
    var p = ymd.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / MS_PER_DAY); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function fmtDate(d) {
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function fmtDow(d) {
    return d.toLocaleDateString(undefined, { weekday: 'short' }) + ' ' + d.getDate();
  }

  // ---- Schedule ----
  function phaseFor(date) {
    var t = startOfDay(date).getTime();
    var idx = -1;
    for (var i = 0; i < SCHEDULE.length; i++) {
      if (parseLocalDate(SCHEDULE[i].start).getTime() <= t) idx = i;
    }
    if (idx < 0) return { baseline: true, quit: false, strength: null, cap: null, week: null, index: -1 };
    var e = SCHEDULE[idx];
    var quit = e.strength === 'quit';
    return { baseline: false, quit: quit, strength: e.strength, cap: e.hourlyCap, week: quit ? null : idx + 1, index: idx };
  }

  // ---- Storage ----
  function loadHits() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      return arr.filter(function (s) { return typeof s === 'string' && !isNaN(Date.parse(s)); });
    } catch (e) {
      return [];
    }
  }
  function saveHits(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) { /* storage unavailable */ }
  }

  var hits = loadHits();

  // ---- Stats: bucket every hit by local day and hour ----
  function bucketHits(list) {
    var days = {};
    for (var i = 0; i < list.length; i++) {
      var d = new Date(list[i]);
      var k = dayKey(d);
      var b = days[k];
      if (!b) {
        b = { total: 0, perHour: [] };
        for (var h = 0; h < 24; h++) b.perHour.push(0);
        days[k] = b;
      }
      b.total++;
      b.perHour[d.getHours()]++;
    }
    return days;
  }
  function dayStats(buckets, day) {
    var b = buckets[dayKey(day)] || null;
    var cap = phaseFor(day).cap;
    var total = b ? b.total : 0;
    var over = 0;
    if (b && cap !== null) {
      for (var h = 0; h < 24; h++) if (b.perHour[h] > cap) over++;
    }
    return { total: total, perHour: b ? b.perHour : null, over: over, cap: cap };
  }

  // ---- DOM ----
  var $ = function (id) { return document.getElementById(id); };
  var el = {
    date: $('date'), stamp: $('stamp'), stairs: $('stairs'), week: $('week'), daysLeft: $('daysLeft'),
    hour: $('hour'), ring: $('ring'), count: $('count'), sub: $('sub'), reset: $('reset'),
    figures: $('figures'), todayStrip: $('todayStrip'), history: $('history'),
    btnPlus: $('btnPlus'), btnUndo: $('btnUndo'), btnExport: $('btnExport'), btnReset: $('btnReset')
  };

  function svg(tag, attrs) {
    var n = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  // ---- Staircase: one bar per week, height = that week's cap ----
  var stairBars = [];
  (function buildStairs() {
    var weeks = SCHEDULE.filter(function (e) { return e.strength !== 'quit'; });
    var maxCap = weeks[0].hourlyCap;
    var W = 300, H = 28, gap = 4;
    var bw = (W - gap * (weeks.length - 1)) / weeks.length;
    for (var i = 0; i < weeks.length; i++) {
      var h = Math.max(2, Math.round(H * weeks[i].hourlyCap / maxCap));
      var r = svg('rect', { x: i * (bw + gap), y: H - h, width: bw, height: h, rx: 1.5, 'class': 'step' });
      el.stairs.appendChild(r);
      stairBars.push(r);
    }
  })();

  // ---- Ring geometry: 0° is 12 o'clock, clockwise ----
  var CX = 120, CY = 120, R_SEG = 94, R_TIME = 114;
  function polar(r, deg) {
    var rad = (deg - 90) * Math.PI / 180;
    return { x: CX + r * Math.cos(rad), y: CY + r * Math.sin(rad) };
  }
  function arcPath(r, a0, a1) {
    var s = polar(r, a0), e = polar(r, a1);
    var large = (a1 - a0) > 180 ? 1 : 0;
    return 'M ' + s.x.toFixed(2) + ' ' + s.y.toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + e.x.toFixed(2) + ' ' + e.y.toFixed(2);
  }

  var ring = { cap: undefined, segs: [], timeArc: null, timeDot: null };
  function buildRing(cap) {
    el.ring.textContent = '';
    ring.segs = [];
    ring.cap = cap;
    el.ring.appendChild(svg('circle', { cx: CX, cy: CY, r: R_TIME, 'class': 'time-track' }));
    if (cap === null || cap === 0) {
      el.ring.appendChild(svg('circle', { cx: CX, cy: CY, r: R_SEG, 'class': 'seg track-only' }));
    } else {
      var span = 360 / cap;
      var gap = cap === 1 ? 5 : Math.min(6, span * 0.2);
      for (var i = 0; i < cap; i++) {
        var a0 = i * span + gap / 2, a1 = (i + 1) * span - gap / 2;
        var p = svg('path', { d: arcPath(R_SEG, a0, a1), 'class': 'seg' });
        el.ring.appendChild(p);
        ring.segs.push(p);
      }
    }
    ring.timeArc = svg('path', { d: '', 'class': 'time-arc' });
    ring.timeDot = svg('circle', { cx: CX, cy: CY - R_TIME, r: 3.5, 'class': 'time-dot' });
    el.ring.appendChild(ring.timeArc);
    el.ring.appendChild(ring.timeDot);
  }

  var lastHourKey = null, lastCount = 0;

  function render() {
    var now = new Date();
    var phase = phaseFor(now);
    var buckets = bucketHits(hits);
    var today = dayStats(buckets, now);
    var cap = phase.cap;
    var hourCount = today.perHour ? today.perHour[now.getHours()] : 0;

    // Top line
    el.date.textContent = fmtDate(now);
    el.stamp.textContent = phase.baseline ? 'Baseline' : (phase.quit ? 'Quit' : phase.strength);

    // Staircase + caption
    for (var i = 0; i < stairBars.length; i++) {
      var cls = 'step';
      if (phase.quit || (phase.week !== null && i < phase.week - 1)) cls += ' past';
      else if (phase.week !== null && i === phase.week - 1) cls += ' now';
      stairBars[i].setAttribute('class', cls);
    }
    el.week.textContent = phase.baseline ? 'Baseline week' : (phase.quit ? 'Quit' : 'Week ' + phase.week + ' of ' + TOTAL_WEEKS);
    var daysLeft = daysBetween(now, parseLocalDate(QUIT_DATE));
    el.daysLeft.textContent = daysLeft > 0 ? daysLeft + (daysLeft === 1 ? ' day to quit' : ' days to quit')
      : (daysLeft === 0 ? 'Quit day' : (-daysLeft) + (daysLeft === -1 ? ' day since quit' : ' days since quit'));

    // Ring
    if (ring.cap !== cap) buildRing(cap);
    var hourKey = dayKey(now) + '-' + now.getHours();
    var popIndex = (hourKey === lastHourKey && hourCount === lastCount + 1) ? hourCount - 1 : -1;
    for (var s = 0; s < ring.segs.length; s++) {
      ring.segs[s].setAttribute('class', 'seg' + (s < hourCount ? ' used' : '') + (s === popIndex ? ' pop' : ''));
    }
    lastHourKey = hourKey;
    lastCount = hourCount;
    var frac = (now.getMinutes() * 60 + now.getSeconds()) / 3600;
    var deg = frac * 360;
    ring.timeArc.setAttribute('d', deg > 0.5 ? arcPath(R_TIME, 0, deg) : '');
    var dot = polar(R_TIME, deg);
    ring.timeDot.setAttribute('cx', dot.x.toFixed(2));
    ring.timeDot.setAttribute('cy', dot.y.toFixed(2));

    el.count.textContent = String(hourCount);
    var capped = cap !== null && hourCount >= cap;
    if (cap === null) el.sub.textContent = 'this hour · no cap';
    else if (phase.quit) el.sub.textContent = hourCount === 0 ? 'Quit · none allowed' : 'over by ' + hourCount;
    else if (hourCount < cap) el.sub.textContent = (cap - hourCount) + ' left of ' + cap;
    else if (hourCount === cap) el.sub.textContent = 'Cap reached';
    else el.sub.textContent = 'over by ' + (hourCount - cap) + ' · cap ' + cap;
    var minsLeft = Math.max(1, Math.ceil((3600 - (now.getMinutes() * 60 + now.getSeconds())) / 60));
    el.reset.textContent = 'resets in ' + minsLeft + ' min';
    document.body.classList.toggle('capped', capped);

    // Today
    var overText = today.cap === null ? '' : ' · ' + (today.over > 0 ? '<span class="bad">' + today.over + ' h over</span>' : '0 h over');
    el.figures.innerHTML = '<b>' + today.total + '</b> hits · ' + (today.total / HITS_PER_POD).toFixed(1) + ' pods' + overText;
    fillStrip(el.todayStrip, today, now.getHours());

    // History: the 7 days before today
    var frag = document.createDocumentFragment();
    for (var d = 1; d <= 7; d++) {
      var day = addDays(now, -d);
      var st = dayStats(buckets, day);
      var li = document.createElement('li');
      var dow = document.createElement('span');
      dow.className = 'dow';
      dow.textContent = fmtDow(day);
      var strip = document.createElement('div');
      strip.className = 'strip';
      fillStrip(strip, st, -1);
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = String(st.total);
      var over = document.createElement('span');
      over.className = 'over' + (st.over > 0 ? ' bad' : '');
      over.textContent = st.cap === null ? '—' : String(st.over);
      li.appendChild(dow); li.appendChild(strip); li.appendChild(n); li.appendChild(over);
      frag.appendChild(li);
    }
    el.history.textContent = '';
    el.history.appendChild(frag);

    el.btnUndo.disabled = hits.length === 0;
  }

  // One cell per clock hour; tone by how the hour went against its cap.
  function fillStrip(container, stats, nowHour) {
    var per = stats.perHour, cap = stats.cap;
    var max = 1;
    if (per && cap === null) for (var m = 0; m < 24; m++) if (per[m] > max) max = per[m];
    container.textContent = '';
    for (var h = 0; h < 24; h++) {
      var cell = document.createElement('i');
      var n = per ? per[h] : 0;
      var cls = '';
      if (n > 0) {
        if (cap === null) { cls = 'plain'; cell.style.setProperty('--f', (0.3 + 0.7 * n / max).toFixed(2)); }
        else if (cap === 0 || n > cap) cls = 'over';
        else if (n === cap) cls = 'cap';
        else { cls = 'under'; cell.style.setProperty('--f', (0.3 + 0.65 * n / cap).toFixed(2)); }
      }
      if (nowHour >= 0 && h > nowHour) cls += ' future';
      if (h === nowHour) cls += ' now';
      if (cls) cell.className = cls.trim();
      container.appendChild(cell);
    }
  }

  // ---- Actions ----
  function addHit() {
    hits.push(new Date().toISOString());
    saveHits(hits);
    render();
  }
  function undoHit() {
    if (!hits.length) return;
    var latest = 0;
    for (var i = 1; i < hits.length; i++) {
      if (Date.parse(hits[i]) > Date.parse(hits[latest])) latest = i;
    }
    hits.splice(latest, 1);
    saveHits(hits);
    render();
  }
  function flashLabel(btn, text) {
    var original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = text;
    clearTimeout(btn._flashTimer);
    btn._flashTimer = setTimeout(function () { btn.textContent = original; }, 1500);
  }
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function exportHits() {
    var text = JSON.stringify(hits);
    var done = function (ok) {
      if (ok) {
        flashLabel(el.btnExport, 'Copied ' + hits.length);
        return;
      }
      // Last resort: show the JSON so it can be copied by hand.
      var shown = false;
      try { window.prompt('Copy your hits JSON:', text); shown = true; } catch (e) { shown = false; }
      if (!shown) flashLabel(el.btnExport, 'Copy failed');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(legacyCopy(text)); });
    } else {
      done(legacyCopy(text));
    }
  }
  function resetHits() {
    if (!window.confirm('Delete all logged hits? This cannot be undone.')) return;
    hits = [];
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    render();
  }

  el.btnPlus.addEventListener('click', addHit);
  el.btnUndo.addEventListener('click', undoHit);
  el.btnExport.addEventListener('click', exportHits);
  el.btnReset.addEventListener('click', resetHits);

  // ---- Keep the clock honest: re-render at the top of each hour and whenever the app comes back ----
  var hourTimer = null;
  function scheduleHourTick() {
    clearTimeout(hourTimer);
    var now = new Date();
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours() + 1, 0, 0, 250);
    hourTimer = setTimeout(function () { render(); scheduleHourTick(); }, next - now);
  }
  function wake() {
    hits = loadHits();
    render();
    scheduleHourTick();
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) wake(); });
  window.addEventListener('pageshow', wake);
  window.addEventListener('focus', wake);
  setInterval(render, 20000);

  render();
  scheduleHourTick();

  // ---- Offline shell: service workers only exist over http(s), never on file:// ----
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    var registerSW = function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* offline support is optional */ });
    };
    if (document.readyState === 'complete') registerSW();
    else window.addEventListener('load', registerSW);
  }
})();
</script>
</body>
</html>
