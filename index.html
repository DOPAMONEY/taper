<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Taper">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)">
<title>Taper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  /* A ration ledger. Parchment and ink by day, graphite and vapor by night.
     Honey is the ration you have spent; ember is the line you crossed. */
  :root {
    color-scheme: light dark;
    --page: #f4f1ea;
    --slab: #fbf9f4;
    --ink: #1b1a17;
    --ink-2: rgba(27, 26, 23, 0.74);
    --ink-3: rgba(27, 26, 23, 0.62);
    /* --ink-4 is for non-text only (past steps, tracks) */
    --ink-4: rgba(27, 26, 23, 0.34);
    --rule: rgba(27, 26, 23, 0.10);
    --track: rgba(27, 26, 23, 0.08);
    --honey: #b77d0f;
    --honey-ink: #1b1a17;
    --ember: #c4372a;
    --ember-ink: #fff6f2;
    --face-display: ui-serif, "New York", "Iowan Old Style", Palatino, Georgia, serif;
    --face-ui: -apple-system, BlinkMacSystemFont, system-ui, "SF Pro Text", "Helvetica Neue", sans-serif;
    --face-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #131315;
      --slab: #1c1c1f;
      --ink: #f2efe8;
      --ink-2: rgba(242, 239, 232, 0.76);
      --ink-3: rgba(242, 239, 232, 0.55);
      --ink-4: rgba(242, 239, 232, 0.30);
      --rule: rgba(242, 239, 232, 0.09);
      --track: rgba(242, 239, 232, 0.10);
      --honey: #e3aa3d;
      --honey-ink: #17130a;
      --ember: #ee5b46;
      --ember-ink: #fff5f2;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  /* 106.25% == 17px. Safari then replaces it with the user's Dynamic Type body
     size; browsers that do not know -apple-system-body ignore the second
     declaration and stay at 17px. Every font size below is rem off that base. */
  html {
    font-size: 106.25%;
    font: -apple-system-body;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 0.882rem/1.4 var(--face-ui);
    min-height: 100vh;
    min-height: 100dvh;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 16px)
             calc(env(safe-area-inset-right, 0px) + 20px)
             calc(env(safe-area-inset-bottom, 0px) + 136px)
             calc(env(safe-area-inset-left, 0px) + 20px);
  }

  /* Visible to screen readers only */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* ---- Top line: the date as a ledger heading, the strength as a stamp ---- */
  .top { display: flex; align-items: center; justify-content: space-between; }
  .date { margin: 0; font: 500 1.412rem/1.1 var(--face-display); letter-spacing: -0.01em; }
  .stamp {
    font: 500 0.706rem/1 var(--face-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-2);
    padding: 7px 0 6px;
    font-variant-numeric: tabular-nums;
  }

  /* ---- The staircase: fifteen weeks stepping down to zero ---- */
  .stairs { margin-top: 16px; }
  .stairs svg { display: block; width: 100%; height: 28px; }
  .step { fill: var(--track); transition: fill 0.2s; }
  .step.past { fill: var(--ink-4); }
  .step.now { fill: var(--honey); }
  .caption {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    font-size: 0.706rem;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  /* ---- The ration ring: one segment per allowed hit, a hand sweeping to the reset ---- */
  .hour {
    position: relative;
    width: min(72vw, 268px);
    aspect-ratio: 1;
    margin: 26px auto 0;
  }
  .ring { display: block; width: 100%; height: 100%; overflow: visible; }
  .seg { fill: none; stroke: var(--track); stroke-width: 16; transition: stroke 0.2s; }
  .seg.used { stroke: var(--honey); }
  .capped .seg.used { stroke: var(--ember); }
  .seg.pop { animation: pop 0.24s var(--ease-out); }
  @keyframes pop { from { stroke-width: 5; opacity: 0.3; } }
  .seg.track-only { stroke-width: 2; stroke: var(--rule); }
  .time-track { fill: none; stroke: var(--rule); stroke-width: 2; }
  .time-arc { fill: none; stroke: var(--ink-3); stroke-width: 2; stroke-linecap: round; }
  .time-dot { fill: var(--ink); }
  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
  }
  .count {
    font-family: var(--face-display);
    font-weight: 500;
    line-height: 1;
    font-size: clamp(56px, 4.6rem, 92px);
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    transition: color 0.2s;
  }
  .capped .count { color: var(--ember); }
  .sub { margin-top: 5px; font-size: 0.882rem; font-weight: 500; color: var(--ink-2); transition: color 0.2s; }
  .capped .sub { color: var(--ember); }
  .reset { margin-top: 7px; font: 0.706rem/1 var(--face-mono); letter-spacing: 0.02em; color: var(--ink-3); }

  /* ---- Ledger rows ---- */
  .section { margin-top: 32px; }
  .row-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 0;
    font-size: 0.647rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .figures {
    font: 500 0.765rem/1 var(--face-ui);
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .figures b { font-weight: 600; color: var(--ink); }
  .figures .bad { font-weight: 600; color: var(--ember); }
  .foot { margin: 8px 0 0; font-size: 0.706rem; color: var(--ink-3); }

  /* 24 cells, one per clock hour */
  .strip { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; height: 10px; overflow: visible; }
  .strip.big { height: 16px; margin-top: 12px; }
  .strip i { display: block; border-radius: 2px; background: var(--track); }
  .strip i.under { background: var(--honey); opacity: var(--f); }
  .strip i.cap { background: var(--honey); }
  /* Over-cap hours get a shape cue as well as ember, so colour is never the only signal */
  .strip i.over {
    background: var(--ember);
    transform: scaleY(1.45);
    transform-origin: bottom;
    border-radius: 2px 2px 1px 1px;
  }
  .strip i.plain { background: var(--ink-3); opacity: var(--f); }
  .strip i.future { opacity: 0.35; }
  .strip i.now { box-shadow: inset 0 0 0 1.5px var(--ink); }

  .days { list-style: none; margin: 8px 0 0; padding: 0; }
  .days li {
    display: grid;
    grid-template-columns: 64px 1fr 40px 36px;
    align-items: center;
    gap: 12px;
    height: 36px;
    border-top: 1px solid var(--rule);
  }
  .days li:first-child { border-top: 0; }
  /* headroom so a taller over-cap cell is never clipped by the row above */
  .days li .strip { margin-top: 6px; }
  .dow { font-size: 0.765rem; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .n { text-align: right; font-size: 0.824rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .days li.baseline .n { color: var(--ink-2); font-weight: 500; }
  .over { text-align: right; font-size: 0.706rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .over.bad { color: var(--ember); font-weight: 600; }

  .tools { display: flex; justify-content: center; gap: 16px; margin-top: 28px; }
  .btn {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    margin: 0;
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .ghost {
    min-height: 44px;
    padding: 0 16px;
    background: none;
    border-radius: 8px;
    font: 500 0.765rem/1 var(--face-ui);
    color: var(--ink-3);
    transition: color 0.12s;
  }
  .ghost:active { color: var(--ink); }
  .ghost.danger:active { color: var(--ember); }

  /* ---- The thumb bar: always under the thumb, never behind the scroll ---- */
  .thumb {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    padding: 18px calc(env(safe-area-inset-right, 0px) + 16px)
             calc(env(safe-area-inset-bottom, 0px) + 12px)
             calc(env(safe-area-inset-left, 0px) + 16px);
    /* fade anchored to a fixed 24px so the bar stays opaque behind #note and
       #backdate however tall they make it */
    background: linear-gradient(to top, var(--page) calc(100% - 24px), transparent);
  }
  .note {
    text-align: center;
    font-size: 0.765rem;
    font-weight: 500;
    color: var(--ink-2);
    min-height: 20px;
    margin: 0 auto 8px;
    max-width: 448px;
  }
  .note.warn { color: var(--ember); }
  .note.action {
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .backdate {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin: 0 auto 10px;
    max-width: 448px;
  }
  .backdate-label {
    font-size: 0.765rem;
    color: var(--ink-2);
    width: 100%;
    text-align: center;
  }
  .chip {
    min-height: 44px;
    padding: 0 14px;
    border-radius: 12px;
    background: var(--slab);
    box-shadow: inset 0 0 0 1px var(--rule);
    color: var(--ink);
    font: 500 0.882rem var(--face-ui);
  }
  .chip:active { transform: scale(0.97); }
  .thumb-inner { display: flex; gap: 10px; max-width: 448px; margin: 0 auto; }
  .plus {
    flex: 3;
    min-height: 88px;
    border-radius: 18px;
    background: var(--honey);
    color: var(--honey-ink);
    font: 500 2.588rem/1 var(--face-display);
    letter-spacing: -0.02em;
    transition: transform 0.12s var(--ease-out), background-color 0.2s, color 0.2s;
  }
  .plus:active { transform: scale(0.97); }
  .capped .plus { background: var(--ember); color: var(--ember-ink); }
  .undo {
    flex: 1;
    min-height: 88px;
    border-radius: 18px;
    background: var(--slab);
    box-shadow: inset 0 0 0 1px var(--rule);
    color: var(--ink-2);
    font: 600 0.882rem/1 var(--face-ui);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s var(--ease-out), opacity 0.2s;
  }
  .undo:active { transform: scale(0.97); }
  .undo:disabled { opacity: 0.35; transform: none; cursor: default; }
  .undo-time {
    display: block;
    margin-top: 4px;
    font: 0.706rem/1 var(--face-mono);
    color: var(--ink-3);
  }

  /* ---- Short screens: keep the ring, the count and the thumb bar all visible ---- */
  @media (max-height: 700px) {
    .hour { width: min(60vw, 224px); margin-top: 18px; }
    .count { font-size: clamp(48px, 3.8rem, 64px); }
    .section { margin-top: 24px; }
  }

  /* ---- Partner: a second ledger, quieter than your own ---- */
  .partner-empty { margin: 10px 0 0; font-size: 0.765rem; color: var(--ink-2); }
  .partner-when { font: 0.647rem/1 var(--face-mono); letter-spacing: 0.04em; color: var(--ink-3); }
  .partner-when.stale { color: var(--ember); }
  .pdays { list-style: none; margin: 10px 0 0; padding: 0; }
  .pdays li {
    display: grid;
    grid-template-columns: 64px 1fr 40px 36px;
    align-items: center;
    gap: 12px;
    height: 32px;
    border-top: 1px solid var(--rule);
  }
  .pdays li:first-child { border-top: 0; }
  .ptrack { height: 8px; border-radius: 2px; background: var(--track); }
  .pfill { display: block; height: 100%; min-width: 2px; border-radius: 2px; background: var(--honey); }
  /* a day that broke the cap reads ember and carries a notch, so hue is never the only cue */
  .pfill.breach { background: var(--ember); box-shadow: inset -3px 0 0 var(--page); }
  .partner-actions { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; }

  @media (prefers-reduced-motion: reduce) {
    .seg.pop { animation: none; }
    .plus, .undo, .seg, .count, .sub, .step { transition: none; }
  }
</style>
</head>
<body>

<main>
  <header class="top">
    <h1 class="date" id="date">—</h1>
    <div class="stamp" id="stamp">—</div>
  </header>

  <section class="stairs" aria-label="Taper schedule">
    <svg id="stairs" viewBox="0 0 300 28" preserveAspectRatio="none" role="img" aria-label="Hourly cap by week"></svg>
    <div class="caption"><span id="week">—</span><span id="daysLeft">—</span></div>
  </section>

  <section class="hour" id="hour">
    <svg class="ring" id="ring" viewBox="0 0 240 240" aria-hidden="true"></svg>
    <div class="center">
      <div class="count" id="count">0</div>
      <div class="sub" id="sub">this hour</div>
      <div class="reset" id="reset"></div>
    </div>
  </section>

  <p class="sr-only" id="live" aria-live="polite"></p>

  <div class="thumb" role="group" aria-label="Log hits">
    <div class="note" id="note" hidden></div>
    <div class="backdate" id="backdate" hidden>
      <span class="backdate-label">Log a hit from</span>
      <button class="btn chip" type="button" data-min="5">5 min ago</button>
      <button class="btn chip" type="button" data-min="15">15 min ago</button>
      <button class="btn chip" type="button" data-min="30">30 min ago</button>
      <button class="btn chip" type="button" data-cancel>Cancel</button>
    </div>
    <div class="thumb-inner">
      <button class="btn plus" id="btnPlus" type="button" aria-label="Log one hit">+1</button>
      <button class="btn undo" id="btnUndo" type="button">Undo<span class="undo-time" id="undoTime"></span></button>
    </div>
  </div>

  <section class="section">
    <h2 class="row-head"><span>Today</span><span class="figures" id="figures"></span></h2>
    <div class="strip big" id="todayStrip" aria-label="Hits by hour today"></div>
  </section>

  <section class="section">
    <h2 class="row-head"><span>Previous 7 days</span><span class="figures">hits · hours over</span></h2>
    <ol class="days" id="history"></ol>
    <p class="foot" id="historyNote" hidden>Gray rows are baseline days with no cap.</p>
  </section>

  <section class="section" id="partnerSection">
    <h2 class="row-head"><span id="partnerLabel">Partner</span><span class="figures" id="partnerFigures"></span></h2>
    <div id="partnerBody"></div>
    <div class="partner-actions">
      <button class="btn ghost" id="btnShare" type="button">Share my progress</button>
      <button class="btn ghost" id="btnPartner" type="button">Paste their code</button>
      <button class="btn ghost danger" id="btnPartnerClear" type="button" hidden>Remove</button>
    </div>
    <p class="foot">A code carries one number per day and nothing else. No times, no accounts, nothing uploaded.</p>
  </section>

  <section class="tools">
    <button class="btn ghost" id="btnExport" type="button">Copy data</button>
    <button class="btn ghost" id="btnImport" type="button">Import</button>
    <button class="btn ghost danger" id="btnReset" type="button">Delete all data</button>
  </section>
</main>

<script>
(function () {
  'use strict';

  // Each entry applies from its start date (local time) until the next entry's start.
  var SCHEDULE = [
    { start: '2026-09-15', strength: '5%',   hourlyCap: 12 },
    { start: '2026-09-22', strength: '5%',   hourlyCap: 10 },
    { start: '2026-09-29', strength: '5%',   hourlyCap: 8 },
    { start: '2026-10-06', strength: '3%',   hourlyCap: 8 },
    { start: '2026-10-13', strength: '3%',   hourlyCap: 7 },
    { start: '2026-10-20', strength: '3%',   hourlyCap: 6 },
    { start: '2026-10-27', strength: '3%',   hourlyCap: 5 },
    { start: '2026-11-03', strength: '3%',   hourlyCap: 4 },
    { start: '2026-11-10', strength: '3%',   hourlyCap: 3 },
    { start: '2026-11-17', strength: '3%',   hourlyCap: 3 },
    { start: '2026-11-24', strength: '3%',   hourlyCap: 2 },
    { start: '2026-12-01', strength: '3%',   hourlyCap: 2 },
    { start: '2026-12-08', strength: '3%',   hourlyCap: 1 },
    { start: '2026-12-15', strength: '3%',   hourlyCap: 1 },
    { start: '2026-12-22', strength: '3%',   hourlyCap: 1 },
    { start: '2026-12-26', strength: 'quit', hourlyCap: 0 }
  ];
  var QUIT_DATE = '2026-12-26';
  var TOTAL_WEEKS = 15;
  var STORAGE_KEY = 'taper.hits';
  var HITS_PER_POD = 200;
  var MS_PER_DAY = 86400000;
  var MS_PER_HOUR = 3600000;
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var LONG_PRESS_MS = 500;
  var PARTNER_KEY = 'taper.partner';
  var NAME_KEY = 'taper.name';
  var SHARE_DAYS = 21;
  var PARTNER_ROWS = 8;
  var STALE_MS = 36 * MS_PER_HOUR;

  // ---- Date helpers (all in the device's local time) ----
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function parseLocalDate(ymd) {
    var p = ymd.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / MS_PER_DAY); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function fmtDate(d) {
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function fmtTime(d) {
    return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }
  // "Wed 14" inside the current month, "Wed 30 Sep" once the month rolls over.
  function fmtDow(d, ref) {
    var s = d.toLocaleDateString(undefined, { weekday: 'short' }) + ' ' + d.getDate();
    if (d.getMonth() !== ref.getMonth() || d.getFullYear() !== ref.getFullYear()) {
      s += ' ' + d.toLocaleDateString(undefined, { month: 'short' });
    }
    return s;
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  // ---- Schedule ----
  function phaseFor(date) {
    var t = startOfDay(date).getTime();
    var idx = -1;
    for (var i = 0; i < SCHEDULE.length; i++) {
      if (parseLocalDate(SCHEDULE[i].start).getTime() <= t) idx = i;
    }
    if (idx < 0) return { baseline: true, quit: false, strength: null, cap: null, week: null, index: -1 };
    var e = SCHEDULE[idx];
    var quit = e.strength === 'quit';
    return { baseline: false, quit: quit, strength: e.strength, cap: e.hourlyCap, week: quit ? null : idx + 1, index: idx };
  }

  // ---- Storage ----
  function loadHits() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      return arr.filter(function (s) { return typeof s === 'string' && !isNaN(Date.parse(s)); });
    } catch (e) {
      return [];
    }
  }
  // Returns true only when the write actually landed.
  function saveHits(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }

  // ---- DOM ----
  var $ = function (id) { return document.getElementById(id); };
  var el = {
    date: $('date'), stamp: $('stamp'), stairs: $('stairs'), week: $('week'), daysLeft: $('daysLeft'),
    hour: $('hour'), ring: $('ring'), count: $('count'), sub: $('sub'), reset: $('reset'),
    figures: $('figures'), todayStrip: $('todayStrip'), history: $('history'),
    btnPlus: $('btnPlus'), btnUndo: $('btnUndo'), btnExport: $('btnExport'), btnReset: $('btnReset'),
    // Added by the audit pass; every one of these is optional at runtime.
    live: $('live'), note: $('note'), backdate: $('backdate'), undoTime: $('undoTime'),
    btnImport: $('btnImport'), historyNote: $('historyNote'),
    // Partner sharing; all optional, the app runs fine without this markup.
    partnerLabel: $('partnerLabel'), partnerFigures: $('partnerFigures'), partnerBody: $('partnerBody'),
    btnShare: $('btnShare'), btnPartner: $('btnPartner'), btnPartnerClear: $('btnPartnerClear')
  };

  // If the core markup is not there, do nothing rather than throw.
  var REQUIRED = ['date', 'stamp', 'stairs', 'week', 'daysLeft', 'hour', 'ring', 'count', 'sub',
    'reset', 'figures', 'todayStrip', 'history', 'btnPlus', 'btnUndo', 'btnExport', 'btnReset'];
  for (var q = 0; q < REQUIRED.length; q++) {
    if (!el[REQUIRED[q]]) return;
  }

  var hits = loadHits();
  var storageFailed = false;
  var partner = loadPartner();

  // ---- Notes: one line above the thumb controls ----
  var noteTimer = null, noteTag = null, noteAction = null;
  function note(text, opts) {
    if (!el.note) return;
    opts = opts || {};
    clearTimeout(noteTimer);
    noteTimer = null;
    noteTag = opts.tag || null;
    noteAction = typeof opts.action === 'function' ? opts.action : null;
    el.note.textContent = text;
    el.note.className = 'note' + (opts.warn ? ' warn' : '') + (noteAction ? ' action' : '');
    if (noteAction) {
      el.note.setAttribute('role', 'button');
      el.note.setAttribute('tabindex', '0');
    } else {
      el.note.removeAttribute('role');
      el.note.removeAttribute('tabindex');
    }
    el.note.hidden = false;
    if (opts.ms) {
      noteTimer = setTimeout(function () {
        clearNote();
        if (storageFailed) storageNote();
      }, opts.ms);
    }
  }
  function clearNote(tag) {
    if (!el.note) return;
    if (tag && noteTag !== tag) return;
    clearTimeout(noteTimer);
    noteTimer = null;
    noteTag = null;
    noteAction = null;
    el.note.textContent = '';
    el.note.className = 'note';
    el.note.removeAttribute('role');
    el.note.removeAttribute('tabindex');
    el.note.hidden = true;
  }
  function storageNote() {
    note('Not saved. Storage is full or blocked.', { warn: true, tag: 'storage' });
  }
  if (el.note) {
    el.note.addEventListener('click', function () { if (noteAction) noteAction(); });
    el.note.addEventListener('keydown', function (e) {
      if (!noteAction) return;
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        noteAction();
      }
    });
  }

  // Every write goes through here so a failed save is visible and retried.
  function persist() {
    var ok = saveHits(hits);
    if (ok) {
      if (storageFailed) {
        storageFailed = false;
        clearNote('storage');
      }
    } else {
      storageFailed = true;
      storageNote();
    }
    return ok;
  }

  // ---- Stats: bucket every hit by local day and hour ----
  function bucketHits(list) {
    var days = {};
    for (var i = 0; i < list.length; i++) {
      var d = new Date(list[i]);
      var k = dayKey(d);
      var b = days[k];
      if (!b) {
        b = { total: 0, perHour: [] };
        for (var h = 0; h < 24; h++) b.perHour.push(0);
        days[k] = b;
      }
      b.total++;
      b.perHour[d.getHours()]++;
    }
    return days;
  }
  function dayStats(buckets, day) {
    var b = buckets[dayKey(day)] || null;
    var cap = phaseFor(day).cap;
    var total = b ? b.total : 0;
    var over = 0;
    if (b && cap !== null) {
      for (var h = 0; h < 24; h++) if (b.perHour[h] > cap) over++;
    }
    return { total: total, perHour: b ? b.perHour : null, over: over, cap: cap };
  }
  // The live hour is counted by absolute (epoch) hour so a DST change cannot
  // merge or split it. The 24-cell strips stay on local getHours() buckets.
  function countThisHour(t) {
    var epochHour = Math.floor(t / MS_PER_HOUR);
    var n = 0;
    for (var i = 0; i < hits.length; i++) {
      if (Math.floor(Date.parse(hits[i]) / MS_PER_HOUR) === epochHour) n++;
    }
    return n;
  }
  function newestIndex() {
    if (!hits.length) return -1;
    var latest = 0;
    for (var i = 1; i < hits.length; i++) {
      if (Date.parse(hits[i]) > Date.parse(hits[latest])) latest = i;
    }
    return latest;
  }

  function svg(tag, attrs) {
    var n = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  // ---- Staircase: one bar per week, height = that week's cap ----
  var stairBars = [];
  (function buildStairs() {
    var weeks = SCHEDULE.filter(function (e) { return e.strength !== 'quit'; });
    var maxCap = weeks[0].hourlyCap;
    var W = 300, H = 28, gap = 4;
    var bw = (W - gap * (weeks.length - 1)) / weeks.length;
    for (var i = 0; i < weeks.length; i++) {
      var h = Math.max(2, Math.round(H * weeks[i].hourlyCap / maxCap));
      var r = svg('rect', { x: i * (bw + gap), y: H - h, width: bw, height: h, rx: 1.5, 'class': 'step' });
      el.stairs.appendChild(r);
      stairBars.push(r);
    }
  })();

  // ---- Ring geometry: 0 degrees is 12 o'clock, clockwise ----
  var CX = 120, CY = 120, R_SEG = 94, R_TIME = 114;
  function polar(r, deg) {
    var rad = (deg - 90) * Math.PI / 180;
    return { x: CX + r * Math.cos(rad), y: CY + r * Math.sin(rad) };
  }
  function arcPath(r, a0, a1) {
    var s = polar(r, a0), e = polar(r, a1);
    var large = (a1 - a0) > 180 ? 1 : 0;
    return 'M ' + s.x.toFixed(2) + ' ' + s.y.toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + e.x.toFixed(2) + ' ' + e.y.toFixed(2);
  }

  var ring = { cap: undefined, segs: [], timeArc: null, timeDot: null };
  function buildRing(cap) {
    el.ring.textContent = '';
    ring.segs = [];
    ring.cap = cap;
    el.ring.appendChild(svg('circle', { cx: CX, cy: CY, r: R_TIME, 'class': 'time-track' }));
    if (cap === null || cap === 0) {
      el.ring.appendChild(svg('circle', { cx: CX, cy: CY, r: R_SEG, 'class': 'seg track-only' }));
    } else {
      var span = 360 / cap;
      var gap = cap === 1 ? 5 : Math.min(6, span * 0.2);
      for (var i = 0; i < cap; i++) {
        var a0 = i * span + gap / 2, a1 = (i + 1) * span - gap / 2;
        var p = svg('path', { d: arcPath(R_SEG, a0, a1), 'class': 'seg' });
        el.ring.appendChild(p);
        ring.segs.push(p);
      }
    }
    ring.timeArc = svg('path', { d: '', 'class': 'time-arc' });
    ring.timeDot = svg('circle', { cx: CX, cy: CY - R_TIME, r: 3.5, 'class': 'time-dot' });
    el.ring.appendChild(ring.timeArc);
    el.ring.appendChild(ring.timeDot);
  }

  var lastHourKey = null, lastCount = 0, lastLiveKey = null;

  function render() {
    var now = new Date();
    var phase = phaseFor(now);
    var buckets = bucketHits(hits);
    var today = dayStats(buckets, now);
    var cap = phase.cap;
    var hourCount = countThisHour(now.getTime());

    // Top line
    el.date.textContent = fmtDate(now);
    el.stamp.textContent = phase.baseline ? 'Baseline' : (phase.quit ? 'Quit' : phase.strength);

    // Staircase + caption
    for (var i = 0; i < stairBars.length; i++) {
      var cls = 'step';
      if (phase.quit || (phase.week !== null && i < phase.week - 1)) cls += ' past';
      else if (phase.week !== null && i === phase.week - 1) cls += ' now';
      stairBars[i].setAttribute('class', cls);
    }
    if (phase.baseline) el.week.textContent = 'Baseline week';
    else if (phase.quit) el.week.textContent = 'Quit';
    else el.week.textContent = 'Week ' + phase.week + ' of ' + TOTAL_WEEKS + ' · ' + cap + ' an hour';
    var daysLeft = daysBetween(now, parseLocalDate(QUIT_DATE));
    el.daysLeft.textContent = daysLeft > 0 ? daysLeft + (daysLeft === 1 ? ' day to quit' : ' days to quit')
      : (daysLeft === 0 ? 'Quit day' : (-daysLeft) + (daysLeft === -1 ? ' day since quit' : ' days since quit'));

    // Ring
    if (ring.cap !== cap) buildRing(cap);
    var hourKey = String(Math.floor(now.getTime() / MS_PER_HOUR));
    var popIndex = (hourKey === lastHourKey && hourCount === lastCount + 1) ? hourCount - 1 : -1;
    for (var s = 0; s < ring.segs.length; s++) {
      ring.segs[s].setAttribute('class', 'seg' + (s < hourCount ? ' used' : '') + (s === popIndex ? ' pop' : ''));
    }
    lastHourKey = hourKey;
    lastCount = hourCount;
    var frac = (now.getMinutes() * 60 + now.getSeconds()) / 3600;
    var deg = frac * 360;
    ring.timeArc.setAttribute('d', deg > 0.5 ? arcPath(R_TIME, 0, deg) : '');
    var dot = polar(R_TIME, deg);
    ring.timeDot.setAttribute('cx', dot.x.toFixed(2));
    ring.timeDot.setAttribute('cy', dot.y.toFixed(2));

    el.count.textContent = String(hourCount);
    var capped = cap !== null && hourCount >= cap;
    var minsLeft = Math.max(1, Math.ceil((3600 - (now.getMinutes() * 60 + now.getSeconds())) / 60));

    // Sub line + the one live-region sentence.
    var subText, liveKey, liveText;
    if (phase.quit) {
      subText = 'Quit · none allowed';
      liveKey = hourCount + ' this hour, quit day, none allowed.';
      liveText = liveKey;
    } else {
      if (cap === null) {
        subText = 'this hour · no cap';
        liveKey = hourCount + ' this hour, no cap,';
      } else if (hourCount < cap) {
        subText = hourCount + ' of ' + cap + ' · ' + (cap - hourCount) + ' left';
        liveKey = hourCount + ' of ' + cap + ' this hour, ' + (cap - hourCount) + ' left,';
      } else if (hourCount === cap) {
        subText = 'Cap reached · ' + hourCount + ' of ' + cap;
        liveKey = 'Cap reached, ' + hourCount + ' of ' + cap + ',';
      } else {
        subText = 'Over by ' + (hourCount - cap) + ' · cap ' + cap;
        liveKey = 'Over by ' + (hourCount - cap) + ', cap ' + cap + ',';
      }
      liveText = liveKey + ' resets in ' + plural(minsLeft, 'minute', 'minutes') + '.';
    }
    el.sub.textContent = subText;
    el.reset.textContent = 'resets in ' + minsLeft + ' min';
    document.body.classList.toggle('capped', capped);
    // Announce only when the state changes; the ticking minute alone must not re-announce.
    if (el.live && liveKey !== lastLiveKey) {
      el.live.textContent = liveText;
      lastLiveKey = liveKey;
    }

    // Today
    var overText = today.cap === null ? '' : ' · ' + (today.over > 0 ? '<span class="bad">' + today.over + ' h over</span>' : '0 h over');
    el.figures.innerHTML = '<b>' + today.total + '</b> hits · ' + (today.total / HITS_PER_POD).toFixed(1) + ' pods' + overText;
    fillStrip(el.todayStrip, today, now.getHours());

    // History: the 7 days before today
    var frag = document.createDocumentFragment();
    var anyBaseline = false;
    for (var d = 1; d <= 7; d++) {
      var day = addDays(now, -d);
      var st = dayStats(buckets, day);
      var li = document.createElement('li');
      if (st.cap === null) {
        li.className = 'baseline';
        anyBaseline = true;
      }
      var dow = document.createElement('span');
      dow.className = 'dow';
      dow.textContent = fmtDow(day, now);
      var strip = document.createElement('div');
      strip.className = 'strip';
      fillStrip(strip, st, -1);
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = String(st.total);
      var over = document.createElement('span');
      over.className = 'over' + (st.over > 0 ? ' bad' : '');
      over.textContent = st.cap === null ? '—' : String(st.over);
      li.appendChild(dow); li.appendChild(strip); li.appendChild(n); li.appendChild(over);
      frag.appendChild(li);
    }
    el.history.textContent = '';
    el.history.appendChild(frag);
    if (el.historyNote) el.historyNote.hidden = !anyBaseline;

    renderPartner(now);

    // Undo only reaches back one hour, and says which hit it would remove.
    var idx = newestIndex();
    var undoable = false, undoAt = 0;
    if (idx >= 0) {
      undoAt = Date.parse(hits[idx]);
      var age = now.getTime() - undoAt;
      undoable = age < MS_PER_HOUR && age > -60000;
    }
    el.btnUndo.disabled = !undoable;
    if (el.undoTime) el.undoTime.textContent = undoable ? fmtTime(new Date(undoAt)) : '';
  }

  // One cell per clock hour; tone by how the hour went against its cap.
  function fillStrip(container, stats, nowHour) {
    var per = stats.perHour, cap = stats.cap;
    var max = 1;
    if (per && cap === null) for (var m = 0; m < 24; m++) if (per[m] > max) max = per[m];
    container.textContent = '';
    for (var h = 0; h < 24; h++) {
      var cell = document.createElement('i');
      var n = per ? per[h] : 0;
      var cls = '';
      if (n > 0) {
        if (cap === null) { cls = 'plain'; cell.style.setProperty('--f', (0.3 + 0.7 * n / max).toFixed(2)); }
        else if (cap === 0 || n > cap) cls = 'over';
        else if (n === cap) cls = 'cap';
        else { cls = 'under'; cell.style.setProperty('--f', (0.3 + 0.65 * n / cap).toFixed(2)); }
      }
      if (nowHour >= 0 && h > nowHour) cls += ' future';
      if (h === nowHour) cls += ' now';
      if (cls) cell.className = cls.trim();
      container.appendChild(cell);
    }
  }

  // ---- Actions ----
  function addHit(when) {
    hits.push(new Date(when === undefined ? Date.now() : when).toISOString());
    var ok = persist();
    render();
    return ok;
  }
  function undoHit() {
    var idx = newestIndex();
    if (idx < 0) return;
    var at = Date.parse(hits[idx]);
    var age = Date.now() - at;
    if (!(age < MS_PER_HOUR && age > -60000)) return;
    hits.splice(idx, 1);
    var ok = persist();
    render();
    if (ok) note('Removed the ' + fmtTime(new Date(at)) + ' hit', { ms: 2500 });
  }
  function flashLabel(btn, text) {
    var original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = text;
    clearTimeout(btn._flashTimer);
    btn._flashTimer = setTimeout(function () { btn.textContent = original; }, 1500);
  }
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function exportHits() {
    var text = JSON.stringify(hits);
    var n = hits.length;
    var done = function (ok) {
      if (ok) {
        flashLabel(el.btnExport, 'Copied ' + plural(n, 'hit', 'hits'));
        return;
      }
      // Last resort: show the JSON so it can be copied by hand.
      var shown = false;
      try { window.prompt('Copy your hits JSON:', text); shown = true; } catch (e) { shown = false; }
      if (!shown) flashLabel(el.btnExport, 'Copy failed');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(legacyCopy(text)); });
    } else {
      done(legacyCopy(text));
    }
  }
  // ---- Sharing: a code holding one figure per day, carried by the two of you ----
  // Format: TPR1~name~YYYYMMDD~d0.d1.d2...~epochSeconds
  // Each day is "" for nothing, "62" for hits with no breach, "62-3" for hits and hours over.
  // Timestamps never leave the phone; only daily totals do.
  function readLocal(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function writeLocal(key, val) { try { localStorage.setItem(key, val); return true; } catch (e) { return false; } }

  function sanitizeName(s) {
    return String(s == null ? '' : s)
      .replace(/[^A-Za-z0-9 ]/g, '')
      .replace(/\s+/g, ' ')
      .replace(/^ +| +$/g, '')
      .slice(0, 14);
  }
  function myName() { return sanitizeName(readLocal(NAME_KEY)); }

  function buildShareCode(now) {
    var buckets = bucketHits(hits);
    var start = addDays(now, -(SHARE_DAYS - 1));
    var parts = [];
    for (var i = 0; i < SHARE_DAYS; i++) {
      var st = dayStats(buckets, addDays(start, i));
      if (!st.total && !st.over) parts.push('');
      else if (!st.over) parts.push(String(st.total));
      else parts.push(st.total + '-' + st.over);
    }
    var ymd = start.getFullYear() + pad(start.getMonth() + 1) + pad(start.getDate());
    return 'TPR1~' + (myName() || 'Partner') + '~' + ymd + '~' + parts.join('.') +
      '~' + Math.floor(now.getTime() / 1000);
  }

  function parseShareCode(text) {
    var m = String(text == null ? '' : text).match(/TPR1~[^~]{0,20}~\d{8}~[0-9.\-]*~\d{1,12}/);
    if (!m) return null;
    var f = m[0].split('~');
    var ymd = f[2];
    var y = +ymd.slice(0, 4), mo = +ymd.slice(4, 6), d = +ymd.slice(6, 8);
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    var start = new Date(y, mo - 1, d);
    if (isNaN(start.getTime()) || start.getMonth() !== mo - 1) return null;
    var at = +f[4] * 1000;
    if (!isFinite(at) || at <= 0) return null;
    var cells = f[3] === '' ? [] : f[3].split('.');
    if (!cells.length || cells.length > 400) return null;
    var days = [];
    for (var i = 0; i < cells.length; i++) {
      var total = 0, over = 0;
      if (cells[i]) {
        var pcs = cells[i].split('-');
        total = parseInt(pcs[0], 10);
        over = pcs.length > 1 ? parseInt(pcs[1], 10) : 0;
        if (!isFinite(total) || total < 0) total = 0;
        if (!isFinite(over) || over < 0) over = 0;
        // a day holds 24 hours, and a breached hour needs hits in it
        if (over > 24) over = 24;
        if (over > total) over = total;
      }
      days.push({ key: dayKey(addDays(start, i)), total: total, over: over });
    }
    return { name: sanitizeName(f[1]) || 'Partner', at: at, days: days };
  }

  function loadPartner() {
    var raw = readLocal(PARTNER_KEY);
    if (!raw) return null;
    try {
      var o = JSON.parse(raw);
      if (!o || !o.days || !o.days.length || !o.at) return null;
      o.name = sanitizeName(o.name) || 'Partner';
      return o;
    } catch (e) { return null; }
  }

  function ago(ms) {
    if (ms < 0) ms = 0;
    var mins = Math.round(ms / 60000);
    if (mins < 2) return 'just now';
    if (mins < 60) return mins + ' min ago';
    var hrs = Math.round(mins / 60);
    if (hrs < 36) return hrs + 'h ago';
    return plural(Math.round(hrs / 24), 'day ago', 'days ago');
  }

  function copyText(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(legacyCopy(text)); });
    } else {
      done(legacyCopy(text));
    }
  }

  function shareProgress() {
    var name = myName();
    if (!name) {
      var typed;
      try { typed = window.prompt('What name should they see?', ''); }
      catch (e) { note('Sharing needs a text dialog.', { warn: true, ms: 4000 }); return; }
      if (typed === null || typed === undefined) return;
      name = sanitizeName(typed) || 'Partner';
      writeLocal(NAME_KEY, name);
    }
    var now = new Date();
    var today = dayStats(bucketHits(hits), now);
    var line = 'Taper · ' + name + ' · ' + fmtDate(now) + ': ' + plural(today.total, 'hit', 'hits');
    if (today.cap !== null) line += ', ' + plural(today.over, 'hour', 'hours') + ' over cap';
    var text = line + '.\n' + buildShareCode(now);
    copyText(text, function (ok) {
      if (ok) { flashLabel(el.btnShare, 'Copied · send it'); return; }
      var shown = false;
      try { window.prompt('Copy this and send it:', text); shown = true; } catch (e) { shown = false; }
      if (!shown) flashLabel(el.btnShare, 'Copy failed');
    });
  }

  function pastePartner() {
    var raw;
    try { raw = window.prompt('Paste the code they sent you:'); }
    catch (e) { note('Adding a partner needs a paste dialog.', { warn: true, ms: 4000 }); return; }
    if (raw === null || raw === undefined) return;
    if (!String(raw).replace(/^\s+|\s+$/g, '')) return;
    var parsed = parseShareCode(raw);
    if (!parsed) {
      note('That is not a Taper code. Ask them to tap Share my progress.', { warn: true, ms: 4500 });
      return;
    }
    if (!writeLocal(PARTNER_KEY, JSON.stringify(parsed))) {
      note('Not saved. Storage is full or blocked.', { warn: true });
      return;
    }
    partner = parsed;
    render();
    note('Updated ' + parsed.name, { ms: 2500 });
  }

  function removePartner() {
    if (!partner) return;
    var ok = false;
    try { ok = window.confirm('Remove ' + partner.name + '? Your own hits are not touched.'); }
    catch (e) { ok = true; }
    if (!ok) return;
    try { localStorage.removeItem(PARTNER_KEY); } catch (e) { /* nothing to do */ }
    partner = null;
    render();
  }

  // Read-only. Partner figures are never merged into your own hits.
  function renderPartner(now) {
    if (!el.partnerBody || !el.partnerLabel || !el.partnerFigures) return;
    if (el.btnPartnerClear) el.btnPartnerClear.hidden = !partner;
    if (el.btnPartner) el.btnPartner.textContent = partner ? 'Paste their update' : 'Paste their code';
    el.partnerBody.textContent = '';

    if (!partner) {
      el.partnerLabel.textContent = 'Partner';
      el.partnerFigures.textContent = '';
      var p = document.createElement('p');
      p.className = 'partner-empty';
      p.textContent = 'Tap Share my progress and send them the code. Paste theirs here to follow how they are doing.';
      el.partnerBody.appendChild(p);
      return;
    }

    el.partnerLabel.textContent = partner.name;
    var rows = partner.days.slice(-PARTNER_ROWS).reverse();
    var latest = rows[0];
    var age = now.getTime() - partner.at;
    var figures = plural(latest.total, 'hit', 'hits') + ' · ' + latest.over + ' h over · ';
    el.partnerFigures.textContent = figures;
    var when = document.createElement('span');
    when.className = 'partner-when' + (age > STALE_MS ? ' stale' : '');
    when.textContent = ago(age);
    el.partnerFigures.appendChild(when);

    var max = 1, i;
    for (i = 0; i < rows.length; i++) if (rows[i].total > max) max = rows[i].total;

    var list = document.createElement('ol');
    list.className = 'pdays';
    for (i = 0; i < rows.length; i++) {
      var r = rows[i];
      var li = document.createElement('li');
      var dow = document.createElement('span');
      dow.className = 'dow';
      dow.textContent = fmtDow(parseLocalDate(r.key), now);
      var track = document.createElement('div');
      track.className = 'ptrack';
      if (r.total > 0) {
        var fill = document.createElement('span');
        fill.className = 'pfill' + (r.over > 0 ? ' breach' : '');
        fill.style.width = Math.max(2, Math.round(100 * r.total / max)) + '%';
        track.appendChild(fill);
      }
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = String(r.total);
      var over = document.createElement('span');
      over.className = 'over' + (r.over > 0 ? ' bad' : '');
      over.textContent = String(r.over);
      li.appendChild(dow); li.appendChild(track); li.appendChild(n); li.appendChild(over);
      list.appendChild(li);
    }
    el.partnerBody.appendChild(list);
  }

  function importHits() {
    var raw;
    try {
      raw = window.prompt('Paste your hits JSON:');
    } catch (e) {
      note('Import needs a paste dialog.', { warn: true, ms: 4000 });
      return;
    }
    if (raw === null || raw === undefined) return;
    raw = String(raw).replace(/^\s+|\s+$/g, '');
    if (!raw) return;
    var parsed = null, bad = false;
    try { parsed = JSON.parse(raw); } catch (e) { bad = true; }
    if (bad || !Array.isArray(parsed)) {
      note('Could not read that. Paste the JSON from Copy data.', { warn: true, ms: 4000 });
      return;
    }
    var i, valid = [], pasted = {};
    for (i = 0; i < parsed.length; i++) {
      var v = parsed[i];
      if (typeof v !== 'string' || isNaN(Date.parse(v)) || pasted[v]) continue;
      pasted[v] = 1;
      valid.push(v);
    }
    if (parsed.length && !valid.length) {
      note('Could not read that. Paste the JSON from Copy data.', { warn: true, ms: 4000 });
      return;
    }
    // Merge, never replace: existing hits always survive an import.
    var seen = {};
    var merged = [];
    for (i = 0; i < hits.length; i++) {
      if (!seen[hits[i]]) { seen[hits[i]] = 1; merged.push(hits[i]); }
    }
    var added = 0;
    for (i = 0; i < valid.length; i++) {
      if (!seen[valid[i]]) { seen[valid[i]] = 1; merged.push(valid[i]); added++; }
    }
    merged.sort(function (a, b) { return Date.parse(a) - Date.parse(b); });
    hits = merged;
    var ok = persist();
    render();
    if (ok) {
      note('Imported ' + plural(valid.length, 'hit', 'hits') + ' (' + added + ' new)', { ms: 4000 });
    }
  }
  function resetHits() {
    if (!window.confirm('Delete all logged hits? Use Copy data first if you want to keep them. This cannot be undone.')) return;
    hits = [];
    var ok = false;
    try { localStorage.removeItem(STORAGE_KEY); ok = true; } catch (e) { ok = false; }
    if (ok && storageFailed) {
      storageFailed = false;
      clearNote('storage');
    }
    hideBackdate();
    render();
  }

  // ---- Backdating: long-press +1 ----
  function showBackdate() {
    if (!el.backdate) return;
    el.backdate.hidden = false;
  }
  function hideBackdate() {
    if (!el.backdate) return;
    el.backdate.hidden = true;
  }

  var pressTimer = null, suppressClick = false;
  function startPress() {
    if (!el.backdate) return;
    suppressClick = false;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function () {
      pressTimer = null;
      suppressClick = true;
      showBackdate();
    }, LONG_PRESS_MS);
  }
  function endPress() {
    clearTimeout(pressTimer);
    pressTimer = null;
  }
  (function bindPress() {
    var down, up;
    if (window.PointerEvent) {
      down = ['pointerdown'];
      up = ['pointerup', 'pointercancel', 'pointerleave'];
    } else {
      down = ['touchstart', 'mousedown'];
      up = ['touchend', 'touchcancel', 'mouseup', 'mouseleave'];
    }
    for (var i = 0; i < down.length; i++) el.btnPlus.addEventListener(down[i], startPress);
    for (var j = 0; j < up.length; j++) el.btnPlus.addEventListener(up[j], endPress);
    // A long press must not raise the OS callout menu on top of the chooser.
    el.btnPlus.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  })();

  el.btnPlus.addEventListener('click', function () {
    if (suppressClick) { suppressClick = false; return; }
    hideBackdate();
    addHit();
  });
  el.btnUndo.addEventListener('click', undoHit);
  el.btnExport.addEventListener('click', exportHits);
  el.btnReset.addEventListener('click', resetHits);
  if (el.btnImport) el.btnImport.addEventListener('click', importHits);
  if (el.btnShare) el.btnShare.addEventListener('click', shareProgress);
  if (el.btnPartner) el.btnPartner.addEventListener('click', pastePartner);
  if (el.btnPartnerClear) el.btnPartnerClear.addEventListener('click', removePartner);

  if (el.backdate) {
    el.backdate.addEventListener('click', function (e) {
      var t = e.target;
      while (t && t !== el.backdate && !(t.hasAttribute && (t.hasAttribute('data-min') || t.hasAttribute('data-cancel')))) {
        t = t.parentNode;
      }
      if (!t || t === el.backdate || !t.hasAttribute) return;
      if (t.hasAttribute('data-cancel')) { hideBackdate(); return; }
      var min = parseInt(t.getAttribute('data-min'), 10);
      if (isNaN(min)) return;
      var when = Date.now() - min * 60000;
      var ok = addHit(when);
      hideBackdate();
      if (ok) note('Logged a hit for ' + fmtTime(new Date(when)), { ms: 2500 });
    });
  }

  // ---- Keep the clock honest: re-render at the top of each hour and whenever the app comes back ----
  var hourTimer = null;
  function scheduleHourTick() {
    clearTimeout(hourTimer);
    var now = new Date();
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours() + 1, 0, 0, 250);
    hourTimer = setTimeout(function () { render(); scheduleHourTick(); }, next - now);
  }
  function wake() {
    // While a save is failing, memory is the only copy: never overwrite it from storage.
    if (!storageFailed) hits = loadHits();
    render();
    scheduleHourTick();
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) wake(); });
  window.addEventListener('pageshow', wake);
  window.addEventListener('focus', wake);
  setInterval(render, 20000);

  render();
  scheduleHourTick();

  // ---- Offline shell: service workers only exist over http(s), never on file:// ----
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    // Only a page that was already controlled can be "updated"; a first install is silent.
    var hadController = !!navigator.serviceWorker.controller;
    var noticeShown = false;
    if (hadController) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (noticeShown) return;
        noticeShown = true;
        note('Updated · tap to reload', {
          action: function () { location.reload(); },
          tag: 'update'
        });
      });
    }
    var registerSW = function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* offline support is optional */ });
    };
    if (document.readyState === 'complete') registerSW();
    else window.addEventListener('load', registerSW);
  }
})();
</script>
</body>
